<!DOCTYPE html>
<html lang="{% if page.lang == 'pt' %}pt-BR{% else %}en{% endif %}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YX32N5Z0DX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-YX32N5Z0DX');
</script>
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% if page.lang == "pt" %}
  {% assign en_alt = page.url | remove_first: "/pt" %}
  {% if en_alt == "" %}{% assign en_alt = "/" %}{% endif %}
<link rel="alternate" hreflang="en" href="{{ en_alt | absolute_url }}">
<link rel="alternate" hreflang="pt-BR" href="{{ page.url | absolute_url }}">
{% else %}
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="pt-BR" href="{{ '/pt' | append: page.url | absolute_url }}">
<script>
(function () {
  try {
    if (localStorage.getItem('lang')) return;
    var l = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
    if (l.indexOf('pt') === 0) {
      location.replace('{{ "/pt" | relative_url }}' + location.pathname + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
{% endif %}
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

{% include nav.html %}

{{ content }}

{% include footer.html %}

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
