---
layout: default
---
<section class="page-hero fade-up">
  <a href="{{ '/blog/' | relative_url }}" class="page-back">← All Posts</a>
  <div class="page-hero-tag">Journal</div>
  <h1 class="page-hero-title">{{ page.title }}</h1>
  <p class="page-hero-date">{{ page.date | date: "%B %-d, %Y" }}</p>
</section>

<div class="post-body fade-up">
  {{ content }}
</div>
