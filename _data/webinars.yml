- youtube: "_W8hDfAgFa0"
  show: "GTMnow"
  title_en: "The Execution Gap: Where Pipeline Quietly Dies"
  title_pt: "O Gap de Execução: Onde o Pipeline Morre em Silêncio"
  guest: "Adam Liska"
  host: "Sophie Buonassisi"
  blurb_en: "\"I'll follow up on that\" is the most expensive sentence in sales. Adam Liska joins Sophie Buonassisi on GTMnow to break down the execution gap — the space between knowing what to do in a deal and actually doing it — what should be automated now, what stays human, and why this is about to be the golden age for sales reps."
  blurb_pt: "\"Vou dar um retorno sobre isso\" é a frase mais cara em vendas. Adam Liska se junta a Sophie Buonassisi no GTMnow para destrinchar o gap de execução — o espaço entre saber o que fazer em um negócio e de fato fazê-lo — o que deve ser automatizado agora, o que permanece humano e por que esta pode ser a era de ouro para os vendedores."
