helene:
  name: "Helene Doetsch"
  role_en: "Producer & Director"
  role_pt: "Produtora e Diretora"
  bio_en: "Helene is Babilônia's producer and director. She's a former journalist and documentary filmmaker with a background in marketing and PR, and she shoots analog. She cares about two things on every job: whether the story is good, and whether it actually works for the brand."
  bio_pt: "Helene é produtora e diretora da Babilônia. Ex-jornalista e documentarista, com experiência em marketing e assessoria de imprensa, ela também fotografa em analógico. Em todo trabalho ela se importa com duas coisas: se a história é boa, e se ela funciona de verdade para a marca."
